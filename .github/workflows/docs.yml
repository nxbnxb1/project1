# Build the (Vietnamese) method document with XeLaTeX.
name: Docs

on:
  push:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live (XeLaTeX)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-lang-other texlive-fonts-recommended fonts-dejavu lmodern
      - name: Build PDF
        working-directory: docs/method
        run: |
          xelatex -interaction=nonstopmode -halt-on-error DART_method_VI.tex
          xelatex -interaction=nonstopmode -halt-on-error DART_method_VI.tex
      - uses: actions/upload-artifact@v6
        with:
          name: DART-method-pdf
          path: docs/method/DART_method_VI.pdf
